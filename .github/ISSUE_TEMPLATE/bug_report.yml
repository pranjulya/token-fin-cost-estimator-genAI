name: "Bug Report"
description: "Report a bug or unexpected behavior in Token Cost Estimator"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: input
    id: version
    attributes:
      label: "Version / Commit SHA"
      description: "Which version or commit hash are you running?"
      placeholder: "e.g., v0.1.0 or commit f13d7a8"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      options:
        - "Docker Compose"
        - "Local (uv / Python 3.12 + Postgres)"
        - "Kubernetes / Cloud"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Steps or curl command to reproduce the issue."
      placeholder: |
        1. Start the service with `...`
        2. Execute `curl -X POST ...`
        3. Observe error `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs / Output"
      description: "Please paste any relevant structured logs or stack traces (ensure sensitive tokens/keys are redacted)."
      render: shell
