name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: token_cost_estimator_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/token_cost_estimator_test
      APP_API_KEYS: test-user-key
      APP_ADMIN_API_KEYS: test-admin-key
      APP_RATE_LIMIT_PER_MINUTE: "1000"
      APP_RATE_LIMIT_GENERATE_PER_MINUTE: "1000"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Unit tests
        run: uv run pytest tests/unit -p no:cacheprovider

      - name: Integration + contract tests
        run: uv run pytest tests/integration tests/contract -p no:cacheprovider

      - name: Coverage gate (>=80% on src/app)
        run: uv run pytest -p no:cacheprovider --cov=src/app --cov-fail-under=80 --cov-report=term

      - name: Security scan (pip-audit)
        run: uvx pip-audit

      - name: Security scan (secrets)
        run: bash scripts/security_scan.sh

      - name: Build container
        run: docker build -t token-cost-estimator:ci .

      - name: Wheel import smoke test
        # The hatchling src layout must produce an installable wheel that
        # imports app (pip install . should work).
        run: |
          uv build
          uvx --from dist/token_cost_estimator-0.1.0-py3-none-any.whl python -c "import app.main; print('wheel import OK')"

      - name: Run container + smoke test
        # Boot the built image against the Postgres service, wait for /health
        # and /ready, then verify the error envelope on an unauthenticated
        # /v1 call. --network host reaches the postgres service on localhost.
        run: |
          docker run -d --name tce --network host \
            -e APP_DATABASE_URL=postgresql+psycopg://ci:ci@localhost:5432/token_cost_estimator_test \
            -e APP_API_KEYS=ci-user \
            -e APP_ADMIN_API_KEYS=ci-admin \
            -e APP_GENERATE_ENABLED=false \
            token-cost-estimator:ci
          for i in $(seq 1 30); do
            if docker exec tce python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          docker exec tce python -c "
          import json, urllib.request, urllib.error
          h = json.load(urllib.request.urlopen('http://localhost:8000/health'))
          assert h['status'] == 'ok' and 'version' in h, h
          r = urllib.request.urlopen('http://localhost:8000/ready')
          assert json.load(r)['status'] == 'ready', r.read()
          try:
              urllib.request.urlopen('http://localhost:8000/v1/usage')
              raise SystemExit('expected 401 without a key')
          except urllib.error.HTTPError as e:
              assert e.code == 401, e.code
          print('smoke OK:', h)
          "
          docker rm -f tce

      - name: README smoke test (run the documented curl commands)
        # Executes every curl example in README.md against the built image,
        # booted the way the README says (dev keys, seeded pricing) on a fresh
        # database. Fails if a documented payload, status or response shape
        # drifts from the real API. See scripts/readme_smoke.py.
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d postgres -c "CREATE DATABASE readme_smoke"
          docker run -d --name tce-readme --network host \
            -e APP_DATABASE_URL=postgresql+psycopg://ci:ci@localhost:5432/readme_smoke \
            -e APP_ENVIRONMENT=development \
            -e APP_SEED_PRICING=true \
            -e APP_API_KEYS=dev-user-key \
            -e APP_ADMIN_API_KEYS=dev-admin-key \
            -e APP_GENERATE_ENABLED=false \
            token-cost-estimator:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ready >/dev/null; then break; fi
            sleep 2
          done
          python3 scripts/readme_smoke.py --base-url http://localhost:8000 || {
            docker logs tce-readme | tail -40
            exit 1
          }
          docker rm -f tce-readme
