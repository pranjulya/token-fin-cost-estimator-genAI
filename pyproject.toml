[project]
name = "token-cost-estimator"
version = "0.1.0"
description = "GenAI Token Cost Estimator & FinOps service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "greenlet>=3.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tiktoken>=0.7",
    "structlog>=24.1",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "S"]
# B008: FastAPI idiom — Depends()/Header()/Query() in default args is the
# supported pattern for dependency injection, not an accidental mutable default.
# S101: `assert` is the idiomatic test assertion in pytest.
[tool.ruff.lint.per-file-ignores]
"src/app/api/*.py" = ["B008"]
"src/app/api/v1/*.py" = ["B008"]
"tests/**/*.py" = ["S101"]
# One-off local generator (not part of the app); keep it out of CI lint.
"scripts/build_interview_study_guide.py" = ["E", "F", "S", "UP", "B"]
# scripts/demo.py uses assert as smoke-test checks (mirrors test-style asserts).
"scripts/demo.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/", "migrations/"]
